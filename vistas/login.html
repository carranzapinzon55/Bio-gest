<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión - BIO-GEST</title>
    <link rel="stylesheet" href="../assent/css/login_style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=IBM+Plex+Serif:wght@100;400;700&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>

  <body>
    <!--LOGO Y TITULO-->
    <header>
      <div class="logo-container">
        <img src="../assent/img/LOGO PNG.png" alt="logo de tenebrios gold" />
        <h1 class="header-logo">TENEBRIOS GOLD</h1>
      </div>
    </header>

    <main>
      <!--CONTENEDOR DE INICIO DE SESION-->
      <div class="contenedor-login">
        
        <!-- Mensaje dinámico de respuesta de la API -->
        <div id="mensaje" style="display:none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-size: 0.9rem;"></div>

        <form id="form-login">
          <!--HEADER DEL INICIO DE SESION-->
          <div class="contenedor-header">
            <h2>Inicio de sesión</h2>
            <h4>Accede a tu cuenta para continuar</h4>
          </div>

          <!--INPUT DE CORREO ELECTRONICO-->
          <div class="input-contenedor">
            <i class="fas fa-envelope"></i>
            <input type="email" id="correo" placeholder="Correo electrónico" required />
          </div>

          <!--INPUT DE CONTRASEÑA-->
          <div class="input-contenedor">
            <i class="fas fa-lock"></i>
            <input type="password" id="contrasena" placeholder="Contraseña" required />
            <i class="fas fa-eye" id="togglePassword" style="cursor: pointer;"></i>
          </div>

          <!--ENLACE DE CONTRASEÑA OLVIDADA -->
          <div class="contraseña-olvidada">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <hr class="divisor" />

        <!--SECCION DE REGISTRO DE LA CUENTA-->
        <div class="registro-link">
          <span>¿No tienes una cuenta?</span>
          <a href="registro.html">Regístrate</a>
        </div>
      </div>
    </main>
    
    <script src="../assent/javascript/login_script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="../assent/css/login_style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chelsea+Market&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"/>

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>

  <body>
    <!--LOGO Y TIULO DE TENEBRIOS-->
    <header>
      <div class="logo-container">
        <img src="../assent/img/Logo.jpeg" alt="logo de tenebrios gold" />
        <h1 class="header-logo">TENEBRIOS GOLD</h1>
      </div>
    </header>

    <main>
      <!--CONTENEDOR DE INICIO DE SESION-->
      <div class="contenedor-login">
        <form>
          <!--HEADER DEL INICIO DE SESION-->
          <div class="contenedor-header">
            <h2>Inicio de sesión</h2>
            <h4>Accede a tu cuenta para continuar</h4>
          </div>

          <!--INPUT DE CORREO ELECTRONICO-->
          <div class="input-contenedor">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="Correo electrónico" required />
          </div>

          <!--INPUT DE CONTRASEÑA-->
          <div class="input-contenedor">
            <i class="fas fa-lock"></i>
            <input type="password" placeholder="contraseña" required />
            <i class="fas fa-eye"></i>
          </div>

          <!--ENLACE DE CONTRASEÑA OLVIDADA -->
          <div class="contraseña-olvidada">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <hr class="divisor" />

        <!--SECCION DE REGISTRO DE LA CUENTA-->
        <div class="registro-link">
          <span>¿No tienes una cuenta?</span>
          <a href="registro.html">Registrate</a>
        </div>
      </div>
    </main>
  </body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Datos - Tenebrios Gold</title>
    <link rel="stylesheet" href="../assent/css/mi_cuenta_style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-top">
            <div class="logo-container">
                <a href="../index.html" class="logo-link">
                    <img src="../assent/img/Logo.jpeg" alt="Tenebrios Gold" class="logo-img">
                    <div class="logo-text">
                        <span class="brand-title">TENEBRIOS GOLD</span>
                        <span class="brand-subtitle">Alimentos vivos de calidad</span>
                    </div>
                </a>
            </div>
            <div class="search-container">
                <input type="text" placeholder="Buscar productos...">
                <button type="submit" class="search-btn">🔍</button>
            </div>
            <div class="header-user-actions">
                <a href="mi_cuenta.html" class="user-link">👤 Mi cuenta</a>
                <a href="carrito.html" class="cart-btn">🛒 <span id="cart-count">0</span></a>
            </div>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="catalogo.html">Productos</a></li>
                <li><a href="nosotros.html">¿Quiénes somos?</a></li>
                <li><a href="envios.html">Envíos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal">
        <div class="layout-cuenta">
            <aside class="sidebar-cuenta">
                <nav class="menu-cuenta">
                    <a href="mi_cuenta.html" class="item-menu">Mi cuenta</a>
                    <a href="mis_pedidos.html" class="item-menu">Mis pedidos</a>
                    <a href="editar_perfil.html" class="item-menu activo">Mis datos</a>
                    <a href="direcciones.html" class="item-menu">Direcciones</a>
                    <a href="#" id="btn-cerrar-sesion" class="item-menu cerrar-sesion">Cerrar sesión</a>
                </nav>
            </aside>

            <section class="contenido-cuenta">
                <h1 class="titulo-seccion">Mis datos personales</h1>

                <div class="card-formulario">
                    <form id="form-mis-datos" class="form-perfil">
                        <div class="campo-doble">
                            <div class="campo-grupo">
                                <label for="nombre">Nombre</label>
                                <input type="text" id="nombre" value="Carlos" required>
                            </div>
                            <div class="campo-grupo">
                                <label for="apellido">Apellido</label>
                                <input type="text" id="apellido" value="Mendoza" required>
                            </div>
                        </div>

                        <div class="campo-grupo">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" value="carlos.mendoza@email.com" required>
                        </div>

                        <div class="campo-grupo">
                            <label for="telefono">Teléfono / WhatsApp</label>
                            <input type="tel" id="telefono" value="3101234567" required>
                        </div>

                        <hr class="divisor-form">
                        <h3 class="subtitulo-form">Cambiar contraseña (opcional)</h3>

                        <div class="campo-grupo">
                            <label for="pass-actual">Contraseña actual</label>
                            <input type="password" id="pass-actual" placeholder="••••••••">
                        </div>

                        <div class="campo-doble">
                            <div class="campo-grupo">
                                <label for="pass-nueva">Nueva contraseña</label>
                                <input type="password" id="pass-nueva">
                            </div>
                            <div class="campo-grupo">
                                <label for="pass-confirm">Confirmar nueva contraseña</label>
                                <input type="password" id="pass-confirm">
                            </div>
                        </div>

                        <button type="submit" class="btn-guardar">Guardar cambios</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-bottom">
            <p>&copy; 2026 BIO-GEST. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../assent/javascript/mi_cuenta_script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - BIO-GEST</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assent/css/registro_style.css">
</head>

<body>
    <div class="contenedor-pagina">

        <!--PANEL IZQUIERDO-->
        <div class="panel-izquierdo">
            <div class="logo-contenedor">
                <img src="../assent/img/LOGO PNG.png" alt="LOGO PNG TENEBRIOS" class="logo-img">
                <h1>TENEBRIOS GOLD</h1>
                <p class="slogan">Alimentos vivos de calidad</p>
            </div>
            <div class="hoja-decoracion"></div>
        </div>

        <!--PANEL DERECHO-->
        <div class="panel-derecho">

            <!--TARJETA DE REGISTRO-->
            <div class="tarjeta-registro">
                
                <!--ENCABEZADO DE LA TARJETA-->
                <div class="header-tarjeta">
                    <h2>Crear cuenta</h2>
                    <p>Completa los datos para registrarte en TENEBRIOS GOLD</p>
                </div>
                
                <!-- Mensaje dinámico de respuesta de la API -->
                <div id="mensaje" style="display:none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-size: 0.9rem;"></div>

                <!--FORMULARIO DE REGISTRO-->
                <form id="registroForm">
                    
                    <!-- Nombre -->
                    <div class="input-form">
                        <label for="nombre">Nombre *</label>
                        <div class="input-campo">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="nombre" placeholder="Ingresa tu nombre" required>
                        </div>
                    </div>

                    <!-- Apellido (necesario para la tabla usuario de MySQL) -->
                    <div class="input-form">
                        <label for="apellido">Apellido *</label>
                        <div class="input-campo">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="apellido" placeholder="Ingresa tu apellido" required>
                        </div>
                    </div>

                    <!-- Correo electrónico -->
                    <div class="input-form">
                        <label for="email">Correo electrónico *</label>
                        <div class="input-campo">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required>
                        </div>
                    </div>

                    <!-- Teléfono / Celular -->
                    <div class="input-form">
                        <label for="telefono">Teléfono / Celular</label>
                        <div class="input-campo">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="telefono" placeholder="Ej: 3001234567">
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="input-form">
                        <label for="password">Contraseña *</label>
                        <div class="input-campo">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="Crea una contraseña" required>
                            <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- Confirmar contraseña -->
                    <div class="input-form">
                        <label for="confirm-password">Confirmar contraseña *</label>
                        <div class="input-campo">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="confirm-password" placeholder="Confirma tu contraseña" required>
                            <i class="fa-regular fa-eye toggle-password" id="toggleConfirmPassword"></i>
                        </div>
                    </div>



                    <!-- Botón Registrarse -->
                    <button type="submit" class="btn-registrar">Registrarse</button>
                </form>

                <!-- Pie de tarjeta: Iniciar sesión -->
                <div class="login-redirect">
                    <span>¿Ya tienes una cuenta?</span>
                    <a href="login.html">Inicia sesión</a>
                </div>

                <!-- Enlace Volver al inicio -->
                <div class="back-home">
                    <a href="index.html"><i class="fa-solid fa-chevron-left"></i> Volver al inicio</a>
                </div>

            </div>
        </div>

    </div>


    <script src="../assent/javascript/registro_script.js"></script> <!---ENLACE DEL JS DE REGISTRO-->
</body>
</html>
